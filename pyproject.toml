[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wristsleep"
version = "0.1.0"
description = "Sleep staging from Empatica EmbracePlus wrist data (raw pulse + motion deep network, LightGBM for WASO)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1", "lightgbm>=4.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["wristsleep"]
